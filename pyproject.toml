[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddibert"
version = "0.1.0"
description = "Qwen3-initialized BERT embedding alignment experiments"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.51,<6",
  "safetensors>=0.4.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
